name: Refresh profile dashboard

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read public data and render assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Save refreshed dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/ data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile dashboard'
            git push
          fi
